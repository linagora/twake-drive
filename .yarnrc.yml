nodeLinker: node-modules
compressionLevel: mixed # to speed up installation by using a lower compression level for the cache
approvedGitRepositories:
  - "https://github.com/cozy/*"
  - "https://github.com/linagora/*"
  - "https://github.com/konnectors/*"
npmPreapprovedPackages:
  - "@linagora/*"
  - "@cozy/*"
  - "cozy-*"
  - "twake-*"
  - "babel-preset-cozy-app"
  - "rsbuild-config-cozy-app"
  - "stylus-config-cozy-app"
  - "browserslist-config-cozy"
