approvedGitRepositories: # to allow the use of private git repositories
  - "https://github.com/cozy/*"
  - "https://github.com/linagora/*"
  - "https://github.com/konnectors/*"
nodeLinker: node-modules # to avoid using .pnp.cjs files and keep npm compatibility
compressionLevel: mixed # to speed up installation by using a lower compression level for the cache
# enableScripts and npmMinimalAgeGate are left at their Yarn defaults (false,
# and a one day quarantine on freshly published versions). Install scripts run
# arbitrary code from any transitive dependency, in the same environment as
# the release pipeline; the age gate is what covers the window between a
# registry account takeover and its detection. A package that genuinely needs
# to build goes in dependenciesMeta.<name>.built in package.json, so the list
# stays explicit and reviewable.
