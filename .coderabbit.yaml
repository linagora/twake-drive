# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit owns: PR summary and walkthrough, security and supply chain
# review, scanners, and the path-specific checks below.
# It does not own: logic and architecture review (OpenCode, see
# .github/prompts/code-review.md), code health (CodeScene), lint and tests
# (CI/CD workflow). Keep path exclusions in sync with
# .github/workflows/opencode-review.yml.

inheritance: true
language: en-US
tone_instructions: 'Be terse. Comment on security, on the rules below, and on scanner findings. Stay silent on style and complexity.'

reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  estimate_code_review_effort: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - '!.yarn/**'
    - '!CHANGELOG.md'
    - '!**/*.png'
    - '!**/*.svg'
    - '!**/*.jpg'
    - '!**/*.jpeg'

  path_instructions:
    - path: '**/*'
      instructions: >-
        Own the security review: injection, XSS, secret exposure, unsafe
        deserialization, permission and sharing leaks, supply chain risk in
        dependencies and CI. Verify a claim by reading the code before
        reporting it. Do not review logic, architecture, style, formatting or
        complexity: another reviewer and the CI own those.
    - path: 'e2e/**'
      instructions: >-
        Enforce the hard rules of e2e/AGENTS.md: no raw selectors
        (page.locator, getByTestId, getByRole, getByText) in e2e/tests, they
        belong in e2e/pages; no browser.newContext() or authenticate() in
        specs, use fixtures from helpers/fixtures.ts; unique names come from
        stamp(), never Date.now() or Math.random(); temp files removed with
        safeUnlink() in a finally; literal names in a RegExp go through
        escapeRegExp(); no hardcoded URL, port or instance domain.
    - path: 'src/**/*.spec.{js,jsx,ts,tsx}'
      instructions: >-
        Tests use @testing-library/react. Flag Enzyme, snapshot tests and
        __tests__ folders.
    - path: 'src/locales/**'
      instructions: >-
        All 15 language files are maintained in this repository. Flag a key
        added to some language files but missing from others, a key removed
        while still used in src, and a value left in English in another
        language file.
    - path: '.github/workflows/**'
      instructions: >-
        Flag secrets exposed to fork PRs or to untrusted comment triggers,
        pull_request_target with a checkout of the PR head, missing
        permissions blocks, actions pinned to a mutable tag, and untrusted
        input interpolated into a run block.
    - path: 'yarn.lock'
      instructions: >-
        Review resolved versions and integrity values: a package resolving to
        an unexpected registry or URL, a version that moved without a
        package.json change, and a new transitive dependency of a package
        known for supply chain incidents. OpenCode skips this file, so a
        lockfile-only pull request is reviewed here or nowhere.
    - path: 'package.json'
      instructions: >-
        Flag a new dependency that is unmaintained, recently published under
        a name close to a popular package, or that duplicates one already in
        the project.

  tools:
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
