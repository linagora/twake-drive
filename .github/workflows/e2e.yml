name: E2E Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      drive-ref:
        description: Drive branch, tag or commit to test
        type: string
        required: true
      stack-image:
        description: Published Stack image to pull for this run
        type: string
        required: true
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  # The Drive suite is split into shards, each with its own stack: when its
  # jobs get too long, add a shard to the matrix and to the total in E2E_ARGS
  drive:
    name: Drive E2E
    # Adding another label to a labelled pull request does not run it again
    if: >
      inputs.stack-image != '' ||
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # A new push to a labelled pull request cancels the run of the previous
    # one. Job level, so that the skipped runs of the other events cancel
    # nothing; nightly and manual runs each get their own group.
    concurrency:
      group: e2e-drive-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_ARGS: --grep-invert @e2e-scribe --shard=${{ matrix.shard }}/4
      E2E_REPORT: drive-${{ matrix.shard }}
      COZY_E2E_STACK_IMAGE: ${{ inputs.stack-image || 'cozy/cozy-stack:latest' }}
    steps: &e2e-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.drive-ref != '' && 'linagora/twake-drive' || github.repository }}
          ref: ${{ inputs.drive-ref || github.sha }}
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Drive app
        run: yarn build

      # ImageOS is a runner variable, which the env context does not expose
      - name: Read runner image
        id: runner-image
        run: echo "name=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.runner-image.outputs.name }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: yarn e2e ${{ env.E2E_ARGS }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ env.E2E_REPORT }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-${{ env.E2E_REPORT }}
          path: test-results/
          retention-days: 14

  # The cases of the scribe plugin run in a job of their own, so that they can
  # be run alone: the label e2e-scribe runs only them
  scribe:
    name: Scribe E2E
    # Runs again only when the first of its two labels is added
    if: >
      inputs.stack-image == '' &&
      (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' ||
        (github.event.label.name == 'e2e' &&
          !contains(github.event.pull_request.labels.*.name, 'e2e-scribe')) ||
        (github.event.label.name == 'e2e-scribe' &&
          !contains(github.event.pull_request.labels.*.name, 'e2e'))) &&
      (contains(github.event.pull_request.labels.*.name, 'e2e') ||
        contains(github.event.pull_request.labels.*.name, 'e2e-scribe')))
    concurrency:
      group: e2e-scribe-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_ARGS: --grep @e2e-scribe
      E2E_REPORT: scribe
    steps: *e2e-steps
