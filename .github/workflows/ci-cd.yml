name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: BundleMon
        uses: lironer/bundlemon-action@4b47df0793e18e3899eeb07f19b7c88c92c2490e # v1
        continue-on-error: true
      - name: Set SSH for downcloud
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOWNCLOUD_SSH_KEY }}
      # The publication secrets are scoped to this step. Declared at workflow
      # level they were also in the environment of `yarn install`, and so of
      # every install script of every dependency, of the linter, of the tests
      # and of the third-party actions above.
      - name: Publish
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: yarn run cozyPublish --yes
        env:
          MATTERMOST_CHANNEL: '{"dev":"appvengers","beta":"appvengers,publication","stable":"appvengers,publication"}'
          MATTERMOST_HOOK_URL: ${{ secrets.MATTERMOST_HOOK_URL }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
