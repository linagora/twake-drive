# The load balancer in front of the CouchDB cluster: cozy-stack's couchdb.url. A node that does not answer /_up within
# 2s twice is out of the rotation (~4-6s for a paused one), back after 2 good checks. Requests are retried on another
# node only when they could not reach one (connection refused or closed): a request a node accepted is never replayed,
# the writes of CouchDB not being idempotent (POST of a new document).
#
# Two rules for the creation of databases (PUT /<db>, the path a single segment), both making up for cozy-stack in a
# cluster:
#  - cozy-stack --dev (needed here: http instances) creates every database with ?q=1&n=1 (pkg/couchdb/couchdb.go,
#    CreateDB): one copy, on one node. n=1 is rewritten to n=3, a copy on each node.
#  - cozy-stack creates a database from several goroutines at once (the indexes of the global databases at startup):
#    sent to different coordinators, the creations race on the _dbs document and one gets a 500 "conflict", fatal at
#    startup. The creations of one database all go to one coordinator (a hash of the path; a node out of the rotation:
#    another), where they serialize: 201 for one, 412 (already exists, expected by cozy-stack) for the others.

global
    log stdout format raw local0 warning
    maxconn 4096

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 120s
    # the requests of a node paused while they are in flight end there
    timeout server 60s
    timeout check 2s
    timeout queue 10s
    retries 2
    option redispatch
    retry-on conn-failure empty-response

frontend couchdb
    bind :5984
    acl create_db method PUT
    acl create_db_path path_reg ^/[^/_][^/]*/?$
    http-request set-query %[query,regsub('&n=1$','&n=3')] if create_db create_db_path
    use_backend couchdb_create_db if create_db create_db_path
    default_backend couchdb_nodes

backend couchdb_nodes
    balance roundrobin
    option httpchk GET /_up
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server couchdb1 couchdb1:5984 check
    server couchdb2 couchdb2:5984 check
    server couchdb3 couchdb3:5984 check

backend couchdb_create_db
    balance uri path-only
    hash-type consistent
    option httpchk GET /_up
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server couchdb1 couchdb1:5984 check
    server couchdb2 couchdb2:5984 check
    server couchdb3 couchdb3:5984 check

# not published: common.sh's couchdb_healthy reads it from inside the network
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
