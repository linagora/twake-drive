    {{.ThemeCSS}}
  <style>
    /* Static pre-React skeleton: paints at first parse, before the JS bundle.
       Removed by IntentHandler once the real service component mounts. */
    #intent-skeleton {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      background: var(--paperBackgroundColor, #fff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }
    #intent-skeleton header,
    #intent-skeleton .sk-breadcrumb,
    #intent-skeleton footer {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0.9rem 1.25rem;
      flex-shrink: 0;
    }
    #intent-skeleton header {
      justify-content: space-between;
      padding-top: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--dividerColor, #e4e2d9);
    }
    #intent-skeleton .sk-breadcrumb {
      gap: 10px;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    #intent-skeleton footer {
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--dividerColor, #e4e2d9);
    }
    #intent-skeleton .sk-rows {
      flex: 1;
      min-height: 0;
    }
    #intent-skeleton .sk-rows svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* SVG list rows: gray cells + one sweeping highlight rect (no clipPath) */
    #intent-skeleton .sk {
      fill: #efede5;
    }
    #intent-skeleton .sk-shimmer {
      animation: sk-sweep 1.6s linear infinite;
      will-change: transform;
    }
    @keyframes sk-sweep {
      from {
        transform: translateX(-220px);
      }
      to {
        transform: translateX(660px);
      }
    }
    /* Static div cells (header / breadcrumb / footer) — the SVG sweep carries the motion */
    #intent-skeleton .sk-div {
      height: 14px;
      border-radius: 6px;
      background: #efede5;
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      #intent-skeleton .sk {
        fill: #323230;
      }
      #intent-skeleton .sk-div {
        background: #323230;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #intent-skeleton .sk-shimmer {
        animation: none;
      }
    }
  </style>
  <script>
    performance.mark("start");
  </script>
