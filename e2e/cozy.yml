host: 0.0.0.0
port: 80

admin:
  host: 0.0.0.0
  port: 6060

subdomains: flat

# URL-upload fixtures run inside the test Stack on an ephemeral loopback port.
# Only this test config permits that source; production safehttp stays unchanged.
safe_http:
  trusted_private_networks:
    - 127.0.0.1/32

# The stack hardcodes its default registry, which changed over releases; pin it
# so app installs do not depend on the image version.
registries:
  - https://apps-registry.cozycloud.cc/

fs:
  url: file:///var/lib/cozy/storage
  # The stack otherwise waits 15 minutes before recording a new version, which
  # no test can wait for.
  versioning:
    max_number_of_versions_to_keep: 20
    min_delay_between_two_versions: 1s

couchdb:
  url: http://admin:password@couchdb:5984/

office:
  default:
    onlyoffice_url: "http://onlyoffice.{{if .Env.COZY_E2E_ROOT_DOMAIN}}{{.Env.COZY_E2E_ROOT_DOMAIN}}{{else}}cozy.localhost{{end}}:{{if .Env.COZY_E2E_ONLYOFFICE_PORT}}{{.Env.COZY_E2E_ONLYOFFICE_PORT}}{{else}}18081{{end}}"

mail:
  disable_tls: true
  skip_certificate_validation: true
  host: localhost
  port: 25
  noreply_address: noreply@cozy.localhost
  noreply_name: Cozy Test

contexts:
  default:
    default_redirection: drive/
    sharing:
      auto_accept_trusted: true
      auto_accept_trusted_contacts: true
      trusted_domains:
        - "{{if .Env.COZY_E2E_ROOT_DOMAIN}}{{.Env.COZY_E2E_ROOT_DOMAIN}}{{else}}cozy.localhost{{end}}"
    # Directory groups live on the organization instance only, and their
    # changes reach the drives of the members after this delay (30s otherwise).
    centralized_org_directory: true
    org_groups_propagation_delay: 2s

# In production, the directory and other apps declare these exchanges; here the
# stack does. The activity exchange, where the stack replies, is declared by
# the global setup with a queue that keeps the replies for the specs.
rabbitmq:
  enabled: true
  nodes:
    default:
      enabled: true
      url: amqp://cozy:cozy@rabbitmq:5672/
  exchanges:
    - name: b2b
      kind: topic
      durable: true
      declare_exchange: true
      dlx_name: stack.b2b.dlx
      queues:
        - name: stack.b2b.group.lifecycle
          declare: true
          declare_dlx: true
          declare_dlq: true
          dlq_name: stack.dead.letter.b2b.group.lifecycle
          dl_routing_key: b2b.group.dead
          prefetch: 8
          delivery_limit: 5
          bindings:
            - b2b.group.created
            - b2b.group.updated
            - b2b.group.deleted
            - b2b.group.member.added
            - b2b.group.member.removed
        - name: stack.user.lifecycle.queue
          declare: true
          declare_dlx: true
          declare_dlq: true
          dlq_name: stack.dead.letter.user.lifecycle
          dl_routing_key: domain.user.deleted.dead
          prefetch: 8
          delivery_limit: 5
          bindings:
            - domain.user.deleted
    - name: drive
      kind: topic
      durable: true
      declare_exchange: true
      dlx_name: stack.drive.dlx
      queues:
        - name: stack.drive.commands
          declare: true
          declare_dlx: true
          declare_dlq: true
          dlq_name: stack.dead.letter.drive.commands
          dl_routing_key: drive.commands.dead
          prefetch: 8
          delivery_limit: 5
          bindings:
            - drive.org_drive.ensure
